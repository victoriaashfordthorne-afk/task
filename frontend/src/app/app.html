<div class="container">
  <h1>My Tasks</h1>

  @if (tasks.length === 0) {
    <p>No tasks found.</p>
  }

  @for (task of tasks; track task.id) {
    <div class="task">
      <h2>{{ task.name }}</h2>
      <p>{{ task.description }}</p>

      <p>
        Status:
        <strong>
          {{ task.done ? 'Completed' : 'Not completed' }}
        </strong>
      </p>
    </div>
  }
</div>
